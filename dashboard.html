<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare AI Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        h1 { font-size: 2.5em; margin-bottom: 10px; }
        
        .subtitle { opacity: 0.9; font-size: 1.1em; }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        
        .card:hover { transform: translateY(-5px); }
        
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .card-icon { font-size: 2.5em; margin-right: 15px; }
        
        .card-title {
            font-size: 1.2em;
            color: #333;
            font-weight: 600;
        }
        
        .card-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }
        
        .card-label { color: #888; font-size: 0.9em; }
        
        .ai-card { grid-column: 1 / -1; }
        
        .status-normal {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
        }
        
        .status-warning {
            background: linear-gradient(135deg, #f2994a, #f2c94c);
            color: white;
        }
        
        .status-critical {
            background: linear-gradient(135deg, #eb3349, #f45c43);
            color: white;
        }
        
        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            background: rgba(255,255,255,0.3);
            font-weight: bold;
            margin: 10px 0;
        }
        
        .timestamp { color: #888; font-size: 0.9em; margin-top: 15px; }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }
        
        .refresh-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .refresh-btn:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏥 Healthcare AI Dashboard</h1>
            <p class="subtitle">Real-time Health Monitoring with AI Analysis</p>
            <button class="refresh-btn" onclick="fetchData()">🔄 Refresh Data</button>
        </header>
        
        <div id="loading" class="loading">Loading health data...</div>
        <div id="dashboard" class="dashboard" style="display:none;"></div>
    </div>
    
    <script>
        const API_URL = 'http://127.0.0.1:8000';
        const USER_ID = 'test_user_1';
        
        function formatTimestamp(timestamp) {
            if (!timestamp) return 'N/A';
            const date = new Date(timestamp.seconds * 1000);
            return date.toLocaleString();
        }
        
        function getStatusClass(status) {
            if (!status) return 'status-normal';
            if (status.toLowerCase() === 'critical') return 'status-critical';
            if (status.toLowerCase() === 'warning') return 'status-warning';
            return 'status-normal';
        }
        
        async function fetchData() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('dashboard').style.display = 'none';
                
                const response = await fetch(`${API_URL}/user/${USER_ID}/latest`);
                const data = await response.json();
                
                if (data.error) {
                    alert('No data found. Please send test data first!');
                    return;
                }
                
                const reading = data.reading;
                const ai = data.ai_analysis;
                
                const statusClass = getStatusClass(ai?.status);
                
                document.getElementById('dashboard').innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon">💓</div>
                            <div class="card-title">Heart Rate</div>
                        </div>
                        <div class="card-value">${reading.ppg}</div>
                        <div class="card-label">beats per minute</div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon">🌡️</div>
                            <div class="card-title">Temperature</div>
                        </div>
                        <div class="card-value">${reading.temperature}°C</div>
                        <div class="card-label">body temperature</div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon">🫁</div>
                            <div class="card-title">Blood Oxygen</div>
                        </div>
                        <div class="card-value">${reading.spo2}%</div>
                        <div class="card-label">SpO2 saturation</div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon">📊</div>
                            <div class="card-title">ECG Reading</div>
                        </div>
                        <div class="card-value">${reading.ecg}</div>
                        <div class="card-label">cardiac activity</div>
                    </div>
                    
                    <div class="card ai-card ${statusClass}">
                        <div class="card-header">
                            <div class="card-icon">🤖</div>
                            <div class="card-title">AI Health Analysis</div>
                        </div>
                        <div class="status-badge">${ai?.status || 'Analyzing...'}</div>
                        <p style="font-size: 1.1em; margin: 15px 0; line-height: 1.6;">
                            ${ai?.advice || 'Processing health data...'}
                        </p>
                        <p style="opacity: 0.8; margin-top: 10px;">
                            <strong>Confidence:</strong> ${ai?.confidence ? (ai.confidence * 100).toFixed(0) : 'N/A'}%
                            <br>
                            <strong>Model:</strong> ${ai?.model || 'N/A'}
                        </p>
                        <div class="timestamp">
                            📅 Last updated: ${formatTimestamp(reading.timestamp)}
                        </div>
                    </div>
                `;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').style.display = 'grid';
                
            } catch (error) {
                console.error('Error:', error);
                alert('Error loading data. Make sure the server is running!');
            }
        }
        
        // Load data on page load
        fetchData();
        
        // Auto-refresh every 5 seconds
        setInterval(fetchData, 5000);
    </script>
</body>
</html>
